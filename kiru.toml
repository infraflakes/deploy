[profile.dev]
source = "dev/main.kiru"
output = "dev/kirufile"
shell = "sh"
timeout = 300

[profile.dev.project.kiru]
url = "https://github.com/infraflakes/kiru.git"
dir = "~/Projects/kiru"
branch = "dev"
direnv = true

[profile.dev.project.portfolio]
url = "https://github.com/infraflakes/infraflakes.github.io.git"
dir = "~/Projects/portfolio"
direnv = true

[profile.dev.project.deploy]
url = "https://github.com/infraflakes/deploy.git"
dir = "~/.config/kiru"
branch = "devenv"

[profile.dev.project.dots]
url = "https://github.com/infraflakes/dots.git"
dir = "~/dots"

[profile.dev.project.nix]
url = "https://github.com/infraflakes/nixenv.git"
dir = "~/nix"

[profile.dev.project.svim]
url = "https://github.com/infraflakes/svim.git"
dir = "~/.config/nvim"
